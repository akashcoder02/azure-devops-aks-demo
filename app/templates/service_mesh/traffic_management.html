<div class="mesh-traffic">

    <!-- ===================================================== -->
    <!-- SUMMARY -->
    <!-- ===================================================== -->

    <div class="mesh-summary-grid">

        <div class="mesh-card">

            <div class="mesh-card-title">
                Gateways
            </div>

            <div class="mesh-card-value"
                 id="traffic-gateways">
                --
            </div>

            <div class="mesh-card-subtitle">
                Total Gateways
            </div>

        </div>

        <div class="mesh-card">

            <div class="mesh-card-title">
                Virtual Services
            </div>

            <div class="mesh-card-value"
                 id="traffic-virtual-services">
                --
            </div>

            <div class="mesh-card-subtitle">
                Routing Rules
            </div>

        </div>

        <div class="mesh-card">

            <div class="mesh-card-title">
                Destination Rules
            </div>

            <div class="mesh-card-value"
                 id="traffic-destination-rules">
                --
            </div>

            <div class="mesh-card-subtitle">
                Traffic Policies
            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- GATEWAYS -->
    <!-- ===================================================== -->

    <div class="mesh-card">

        <div class="mesh-card-title">

            Gateways

        </div>

        <table class="mesh-status-table">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Namespace</th>

                </tr>

            </thead>

            <tbody id="gateway-table">

                <tr>

                    <td colspan="2">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- ===================================================== -->
    <!-- VIRTUAL SERVICES -->
    <!-- ===================================================== -->

    <div class="mesh-card">

        <div class="mesh-card-title">

            Virtual Services

        </div>

        <table class="mesh-status-table">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Namespace</th>

                </tr>

            </thead>

            <tbody id="virtual-service-table">

                <tr>

                    <td colspan="2">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- ===================================================== -->
    <!-- DESTINATION RULES -->
    <!-- ===================================================== -->

    <div class="mesh-card">

        <div class="mesh-card-title">

            Destination Rules

        </div>

        <table class="mesh-status-table">

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Namespace</th>

                </tr>

            </thead>

            <tbody id="destination-rule-table">

                <tr>

                    <td colspan="2">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
