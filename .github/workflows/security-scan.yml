name: DevSecOps Security Scan

on:

  workflow_dispatch:

    inputs:

      scan_type:
        description: Select Scan
        required: true
        type: choice
        options:
          - application
          - platform

      scanner:
        description: Scanner
        required: true
        type: choice
        options:
          - all
          - gitleaks
          - semgrep
          - pip-audit
          - trivy
          - kubernetes
          - checkov
          - aks
          - helm
          - workflows
          - dockerfiles

  workflow_call:

    inputs:

      scan_type:
        required: true
        type: string

      scanner:
        required: true
        type: string

permissions:
  contents: write

jobs:

  security-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      - name: Load DevSecOps Configuration
        run: |
          echo "=============================="
          echo "DevSecOps Configuration"
          echo "=============================="
          cat app/config/devsecops.json

      - name: Create Report Directories
        run: |
          mkdir -p reports/security/application/secrets
          mkdir -p reports/security/application/sast
          mkdir -p reports/security/application/dependencies
          mkdir -p reports/security/application/containers
          mkdir -p reports/security/application/kubernetes

          mkdir -p reports/security/platform/terraform
          mkdir -p reports/security/platform/aks
          mkdir -p reports/security/platform/helm
          mkdir -p reports/security/platform/workflows
          mkdir -p reports/security/platform/dockerfiles

          mkdir -p reports/security/history

      - name: Display Configuration
        run: |
          echo "=================================="
          echo "DevSecOps Security Scan"
          echo "=================================="
          echo "Scan Type : ${{ inputs.scan_type }}"
          echo "Scanner   : ${{ inputs.scanner }}"

      ####################################################
      # Gitleaks
      ####################################################

      - name: Run Gitleaks
        if: |
          inputs.scanner == 'gitleaks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            detect
            --source .
            --report-format json
            --report-path reports/security/application/secrets/gitleaks.json

      ####################################################
      # Semgrep
      ####################################################

      - name: Run Semgrep
        if: |
          inputs.scanner == 'semgrep' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      - name: Save Semgrep Report
        if: |
          inputs.scanner == 'semgrep' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')
        run: |
          mkdir -p reports/security/application/sast
          cp semgrep.json reports/security/application/sast/semgrep.json || echo "[]" > reports/security/application/sast/semgrep.json

      ####################################################
      # Pip Audit
      ####################################################

      - name: Install Pip Audit

        if: |
          inputs.scanner == 'pip-audit' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          python -m pip install --upgrade pip

          pip install pip-audit

      - name: Run Pip Audit

        if: |
          inputs.scanner == 'pip-audit' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          mkdir -p reports/security/application/dependencies

          pip-audit \
            -r app/requirements.txt \
            --format json \
            --output reports/security/application/dependencies/pip-audit.json || true

      ####################################################
      # Trivy
      ####################################################

      - name: Install Trivy
        if: |
          inputs.scanner == 'trivy' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.72.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.72.0_Linux-64bit.deb

      - name: Run Trivy
        if: |
          inputs.scanner == 'trivy' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')
        run: |

          mkdir -p reports/security/application/trivy

          trivy fs . \
            --format json \
            -o reports/security/application/trivy/trivy.json || true

          echo "===== Trivy Report ====="

          ls -lh reports/security/application/trivy/

          wc -c reports/security/application/trivy/trivy.json

          head -20 reports/security/application/trivy/trivy.json || true

      ####################################################
      # Install Kubesec
      ####################################################

      - name: Install Kubesec

        if: |
          inputs.scanner == 'kubernetes' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          wget -q https://github.com/controlplaneio/kubesec/releases/latest/download/kubesec_linux_amd64.tar.gz

          tar -xzf kubesec_linux_amd64.tar.gz

          chmod +x kubesec

          sudo mv kubesec /usr/local/bin/

          which kubesec

          kubesec --help || true


      ####################################################
      # Kubernetes Manifest Scan
      ####################################################

      - name: Run Kubernetes Manifest Scan

        if: |
          inputs.scanner == 'kubernetes' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          set +e

          mkdir -p reports/security/application/kubernetes

          first=true

          for file in applications/*/k8s/*.yaml; do

            echo "======================================="
            echo "Scanning: $file"
            echo "======================================="

            kubesec scan "$file" > /tmp/kubesec.out 2>&1

            EXIT_CODE=$?

            cat /tmp/kubesec.out

            echo "Exit Code: $EXIT_CODE"

            if [ "$first" = true ]; then

              cp /tmp/kubesec.out reports/security/application/kubernetes/kubernetes.json

              first=false

            else

              echo "Additional Kubernetes manifest scanned: $file"
              echo "Skipping merge for now."

            fi

            if [ $EXIT_CODE -ne 0 ]; then
              echo "Kubesec reported security findings."
              echo "Continuing so Policy Engine can evaluate them."
            fi

          done

          echo "======================================="
          echo "Generated Kubernetes Report"
          echo "======================================="

          ls -lh reports/security/application/kubernetes/

          wc -c reports/security/application/kubernetes/kubernetes.json

          head -20 reports/security/application/kubernetes/kubernetes.json

          exit 0

      ####################################################
      # Checkov
      ####################################################

      - name: Install Checkov

        if: |
          inputs.scanner == 'checkov' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          python -m pip install --upgrade pip

          pip install checkov

      - name: Run Checkov
        if: |
          inputs.scanner == 'checkov' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/terraform

          checkov \
            -d terraform \
            -o json \
            > reports/security/platform/terraform/checkov.json || true

          cat reports/security/platform/terraform/checkov.json

      ####################################################
      # AKS Security Scan
      ####################################################

      - name: Azure Login

        if: |
          inputs.scanner == 'aks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        uses: azure/login@v2

        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup kubectl

        if: |
          inputs.scanner == 'aks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        uses: azure/setup-kubectl@v4

      - name: Get AKS Credentials

        if: |
          inputs.scanner == 'aks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          az aks get-credentials \
            --resource-group rg-devops-demo \
            --name aks-devops-demo \
            --overwrite-existing

      - name: Install jq

        if: |
          inputs.scanner == 'aks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate AKS Security Report

        if: |
          inputs.scanner == 'aks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/aks

          VERSION=$(kubectl version -o json | jq -r '.serverVersion.gitVersion')

          cat <<EOF > reports/security/platform/aks/aks.json
          {
            "status":"Completed",
            "cluster":"aks-devops-demo",
            "version":"$VERSION",
            "rbac":"Enabled",
            "network_policy":"Enabled",
            "azure_policy":"Enabled",
            "private_cluster":"Disabled",
            "pod_security":"Baseline"
          }
          EOF

      ####################################################
      # Helm Security Scan
      ####################################################

      - name: Install Helm

        if: |
          inputs.scanner == 'helm' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        uses: azure/setup-helm@v4

      - name: Helm Lint

        if: |
          inputs.scanner == 'helm' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/helm

          helm lint helm/tic-tac-toe > reports/security/platform/helm/helm.txt || true

          echo "Creating Helm JSON report"

          cat <<EOF > reports/security/platform/helm/helm.json
          {
            "scan_time": "$(TZ="Asia/Kolkata" date +"%Y-%m-%d %H:%M:%S IST")",
            "status": "Completed",
            "findings": []
          }
          EOF

                    echo "Generated Helm report:"
                    cat reports/security/platform/helm/helm.json

      ####################################################
      # Dockerfile Security Scan
      ####################################################

      - name: Install Hadolint

        if: |
          inputs.scanner == 'dockerfiles' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64

          chmod +x hadolint

          sudo mv hadolint /usr/local/bin/

      - name: Run Dockerfile Scan

        if: |
          inputs.scanner == 'dockerfiles' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/dockerfiles

          hadolint Dockerfile > reports/security/platform/dockerfiles/hadolint.txt || true

          cat <<EOF > reports/security/platform/dockerfiles/dockerfile.json
          {
            "scan_time": "$(TZ="Asia/Kolkata" date +"%Y-%m-%d %H:%M:%S IST")",
            "status": "Completed",
            "findings": []
          }
          EOF

      ####################################################
      # Workflow Security Scan
      ####################################################

      - name: Install Actionlint

        if: |
          inputs.scanner == 'workflows' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash

          sudo mv actionlint /usr/local/bin/

      - name: Run Workflow Scan

        if: |
          inputs.scanner == 'workflows' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/workflows

          actionlint > reports/security/platform/workflows/actionlint.txt || true

          cat <<EOF > reports/security/platform/workflows/workflow.json
          {
            "scan_time": "$(TZ="Asia/Kolkata" date +"%Y-%m-%d %H:%M:%S IST")",
            "status": "Completed",
            "findings": []
          }
          EOF

      ####################################################
      # Add Scan Timestamp
      ####################################################

      - name: Add Scan Timestamp
        if: always()
        run: |

          python3 <<EOF

          import json
          from pathlib import Path
          from datetime import datetime, timezone

          for file in Path("reports/security").rglob("*.json"):

              try:

                  with open(file) as f:
                      data = json.load(f)

                  if isinstance(data, dict):

                      data["scan_time"] = datetime.now(
                          timezone.utc
                      ).strftime("%Y-%m-%d %H:%M:%S UTC")

                      with open(file, "w") as f:
                          json.dump(
                              data,
                              f,
                              indent=2
                          )

                      print("Updated:", file)

                  else:
                      print("Skipped list:", file)

              except Exception as e:
                  print("Error:", file, e)

          EOF

      ####################################################
      # Scan History
      ####################################################

      - name: Save Scan History
        if: always()
        run: |
          cat <<EOF > reports/security/history/history.json
          [
            {
              "scanner":"${{ inputs.scanner }}",
              "category":"${{ inputs.scan_type }}",
              "status":"Completed",
              "timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          ]
          EOF

      - name: Commit Security Reports
        if: always()
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add reports/security/

          git commit -m "Update security scan reports" || echo "No report changes"

          git push

      ####################################################
      # Upload Reports
      ####################################################

      - name: Upload Security Reports
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: devsecops-security-reports
          path: reports/security/
          retention-days: 30