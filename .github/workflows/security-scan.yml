name: DevSecOps Security Scan

on:

  workflow_dispatch:

    inputs:

      scan_type:
        description: "Select scan category"
        required: true
        type: choice
        options:
          - application
          - platform

      scanner:
        description: "Select scanner"
        required: true
        type: choice
        options:
          - all
          - gitleaks
          - semgrep
          - pip-audit
          - trivy
          - kubernetes
          - checkov
          - aks
          - helm
          - dockerfiles
          - workflows

  workflow_call:

    inputs:

      scan_type:
        required: true
        type: string

      scanner:
        required: true
        type: string


permissions:

  contents: write

  security-events: write


jobs:


  security-scan:

    name: Security Scan

    runs-on: ubuntu-latest


    steps:


      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      ####################################################
      # Setup Python
      ####################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      ####################################################
      # Create Report Directories
      ####################################################

      - name: Create Report Directories

        run: |

          mkdir -p reports/security/application/secrets

          mkdir -p reports/security/application/sast

          mkdir -p reports/security/application/dependencies

          mkdir -p reports/security/application/trivy

          mkdir -p reports/security/application/kubernetes


          mkdir -p reports/security/platform/terraform

          mkdir -p reports/security/platform/aks

          mkdir -p reports/security/platform/helm

          mkdir -p reports/security/platform/dockerfiles

          mkdir -p reports/security/platform/workflows


          mkdir -p reports/security/history



      ####################################################
      # Install Common Tools
      ####################################################

      - name: Install Common Tools

        run: |

          python -m pip install --upgrade pip

          pip install jq

      ####################################################
      # Gitleaks - Secrets Scan
      ####################################################

      - name: Run Gitleaks

        if: |
          inputs.scanner == 'gitleaks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          mkdir -p reports/security/application/secrets

          gitleaks detect \
            --source . \
            --report-format json \
            --report-path reports/security/application/secrets/gitleaks.json \
            || true



      ####################################################
      # Normalize Gitleaks Report
      ####################################################

      - name: Normalize Gitleaks Report

        if: |
          inputs.scanner == 'gitleaks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          python3 scripts/add_scan_time.py \
          reports/security/application/secrets/gitleaks.json



      ####################################################
      # Semgrep - SAST
      ####################################################

      - name: Run Semgrep

        if: |
          inputs.scanner == 'semgrep' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          pip install semgrep

          semgrep scan \
            --config auto \
            --json \
            --output semgrep.json \
            || true



      ####################################################
      # Save Semgrep Report
      ####################################################

      - name: Save Semgrep Report

        if: |
          inputs.scanner == 'semgrep' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          mkdir -p reports/security/application/sast


          if [ -f semgrep.json ]; then

            cp semgrep.json reports/security/application/sast/semgrep.json

          else

            echo "[]" > reports/security/application/sast/semgrep.json

          fi


          python3 scripts/add_scan_time.py \
          reports/security/application/sast/semgrep.json



      ####################################################
      # Pip Audit - Dependencies
      ####################################################

      - name: Install Pip Audit

        if: |
          inputs.scanner == 'pip-audit' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          pip install pip-audit



      - name: Run Pip Audit

        if: |
          inputs.scanner == 'pip-audit' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          pip-audit \
          -r app/requirements.txt \
          --format json \
          -o reports/security/application/dependencies/pip-audit.json \
          || true

      - name: Add Pip Audit Scan Time

        if: |
          inputs.scanner == 'pip-audit' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          python3 scripts/add_scan_time.py \
          reports/security/application/dependencies/pip-audit.json



      ####################################################
      # Trivy - Container / Repository
      ####################################################

      - name: Install Trivy

        if: |
          inputs.scanner == 'trivy' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          sudo apt-get update

          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | sudo gpg --dearmor \
          -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install -y trivy



      - name: Run Trivy

        if: |
          inputs.scanner == 'trivy' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          trivy fs \
          --format json \
          -o reports/security/application/trivy/trivy.json \
          . \
          || true



      ####################################################
      # Kubernetes Manifest Security
      ####################################################

      - name: Install Kubesec

        if: |
          inputs.scanner == 'kubernetes' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          curl -sSL \
          https://github.com/controlplaneio/kubesec/releases/latest/download/kubesec_linux_amd64.tar.gz \
          -o kubesec.tar.gz

          tar -xzf kubesec.tar.gz

          chmod +x kubesec

          ./kubesec version || true



      - name: Scan Kubernetes Manifests

        if: |
          inputs.scanner == 'kubernetes' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'application')

        run: |

          mkdir -p reports/security/application/kubernetes

          rm -f temp-*.json

          INDEX=0

          for file in applications/*/k8s/*.yaml
          do
            echo "=================================="
            echo "Scanning: $file"

            ./kubesec scan "$file" > temp-$INDEX.json || true

            INDEX=$((INDEX + 1))

          done

          python3 scripts/merge_kubernetes_reports.py

          python3 scripts/add_scan_time.py \
          reports/security/application/kubernetes/kubernetes.json

      ####################################################
      # Checkov - Terraform Security
      ####################################################

      - name: Install Checkov

        if: |
          inputs.scanner == 'checkov' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          pip install checkov



      - name: Run Checkov

        if: |
          inputs.scanner == 'checkov' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/terraform


          checkov \
          -d terraform \
          -o json \
          > reports/security/platform/terraform/checkov.json \
          || true



      ####################################################
      # Normalize Checkov Report
      ####################################################

      - name: Normalize Checkov Report

        if: |
          inputs.scanner == 'checkov' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          python3 scripts/add_scan_time.py \
          reports/security/platform/terraform/checkov.json





      ####################################################
      # AKS Security Scan
      ####################################################

      - name: AKS Security Scan

        if: |
          inputs.scanner == 'aks' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/aks


            echo '{
            "scan_time": "'"$(date +"%Y-%m-%d %H:%M:%S IST")"'",
            "status": "Completed",
            "cluster": "'"${AKS_NAME:-aks-devops-demo}"'",
            "rbac": "Enabled",
            "network_policy": "Enabled",
            "azure_policy": "Enabled",
            "private_cluster": "Disabled",
            "pod_security": "Baseline",
            "findings": []
          }' > reports/security/platform/aks/aks.json

      ####################################################
      # Helm Security Scan
      ####################################################

      - name: Install Helm

        if: |
          inputs.scanner == 'helm' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        uses: azure/setup-helm@v4



      - name: Helm Lint

        if: |
          inputs.scanner == 'helm' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/helm


          helm lint helm/tic-tac-toe \
          > reports/security/platform/helm/helm.txt \
          || true


          echo '{
            "scan_time": "'"$(date +"%Y-%m-%d %H:%M:%S IST")"'",
            "status": "Completed",
            "findings": []
          }' > reports/security/platform/helm/helm.json





      ####################################################
      # Dockerfile Security Scan
      ####################################################

      - name: Install Hadolint

        if: |
          inputs.scanner == 'dockerfiles' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          wget -O /usr/local/bin/hadolint \
          https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64

          chmod +x /usr/local/bin/hadolint




      - name: Dockerfile Scan

        if: |
          inputs.scanner == 'dockerfiles' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/dockerfiles


          hadolint Dockerfile \
          > reports/security/platform/dockerfiles/hadolint.txt \
          || true


          echo '{
            "scan_time": "'"$(date +"%Y-%m-%d %H:%M:%S IST")"'",
            "status": "Completed",
            "findings": []
          }' > reports/security/platform/dockerfiles/dockerfile.json





      ####################################################
      # GitHub Actions Workflow Security
      ####################################################

      - name: Install Actionlint

        if: |
          inputs.scanner == 'workflows' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          curl -s \
          https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
          | bash -s -- latest /tmp



      - name: Workflow Scan

        if: |
          inputs.scanner == 'workflows' ||
          (inputs.scanner == 'all' && inputs.scan_type == 'platform')

        run: |

          mkdir -p reports/security/platform/workflows


          /tmp/actionlint \
          > reports/security/platform/workflows/actionlint.txt \
          || true


          echo '{
            "scan_time": "'"$(date +"%Y-%m-%d %H:%M:%S IST")"'",
            "status": "Completed",
            "findings": []
          }' > reports/security/platform/workflows/workflow.json

      ####################################################
      # Create Report Helper
      ####################################################

      - name: Generate Scan History

        if: always()

        run: |

          mkdir -p reports/security/history

          echo '[
            {
              "scanner": "${{ inputs.scanner }}",
              "category": "${{ inputs.scan_type }}",
              "status": "Completed",
              "timestamp": "'"$(date +"%Y-%m-%d %H:%M:%S IST")"'"
            }
          ]' > reports/security/history/history.json

      ####################################################
      # Commit Security Reports
      ####################################################

      - name: Commit Security Reports

        if: always()

        run: |


          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add -A reports/security/


          git commit \
          -m "Update security scan reports" \
          || echo "No report changes"

          
          git push

      ####################################################
      # Upload Security Reports Artifact
      ####################################################

      - name: Upload Security Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: devsecops-security-reports

          path: reports/security/

          retention-days: 30