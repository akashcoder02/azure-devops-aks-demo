name: Install Service Mesh

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  install-service-mesh:

    name: Install Istio Service Mesh

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/addons/service-mesh

    steps:

      # ==========================================================
      # Checkout Repository
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # Azure Login
      # ==========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ==========================================================
      # Install Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ==========================================================
      # Install kubectl
      # ==========================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # ==========================================================
      # Connect to AKS
      # ==========================================================

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group rg-devops-demo \
            --name aks-devops-demo \
            --overwrite-existing

      # ==========================================================
      # Terraform
      # ==========================================================

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Install Service Mesh
        run: terraform apply -auto-approve tfplan

      # ==========================================================
      # Verify Installation
      # ==========================================================

      - name: Verify Istio Installation
        run: |

          echo "=============================="
          echo "Namespaces"
          echo "=============================="
          kubectl get ns

          echo "=============================="
          echo "Istio Pods"
          echo "=============================="
          kubectl get pods -n istio-system

          echo "=============================="
          echo "Istio Services"
          echo "=============================="
          kubectl get svc -n istio-system

          echo "=============================="
          echo "Gateways"
          echo "=============================="
          kubectl get gateway -A

          echo "=============================="
          echo "Virtual Services"
          echo "=============================="
          kubectl get virtualservice -A

          echo "=============================="
          echo "Destination Rules"
          echo "=============================="
          kubectl get destinationrule -A

      # ==========================================================
      # Workflow Summary
      # ==========================================================

      - name: Installation Summary
        run: |
          echo "======================================"
          echo "Service Mesh installation completed."
          echo "Terraform Apply : SUCCESS"
          echo "Istio Verification : COMPLETED"
          echo "======================================"