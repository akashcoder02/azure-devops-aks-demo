name: Service Mesh Security

on:
  workflow_dispatch:

    inputs:

      action:
        description: Security Action
        required: true
        type: choice
        options:
          - apply
          - destroy

      mtls_mode:
        description: mTLS Mode
        required: true
        default: STRICT
        type: choice
        options:
          - STRICT
          - PERMISSIVE
          - DISABLE

      authorization_enabled:
        description: Enable Authorization Policy
        required: true
        default: true
        type: boolean

      jwt_enabled:
        description: Enable JWT
        required: true
        default: false
        type: boolean

      jwt_issuer:
        description: JWT Issuer
        required: false
        default: ""

      jwt_jwks_uri:
        description: JWT JWKS URI
        required: false
        default: ""

jobs:

  security:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/addons/service-mesh

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # AZURE LOGIN
      # =====================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # =====================================================
      # TERRAFORM
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # =====================================================
      # KUBECTL
      # =====================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # =====================================================
      # AKS CREDENTIALS
      # =====================================================

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group rg-devops-demo \
            --name aks-devops-demo \
            --overwrite-existing

      # =====================================================
      # VERIFY CLUSTER
      # =====================================================

      - name: Verify Cluster
        run: |
          kubectl get nodes
          kubectl get ns

      # =====================================================
      # VERIFY ISTIO
      # =====================================================

      - name: Verify Istio
        run: |
          kubectl get pods -n istio-system

      # =====================================================
      # TERRAFORM INIT
      # =====================================================

      - name: Terraform Init
        run: terraform init

      # =====================================================
      # FORMAT
      # =====================================================

      - name: Terraform Format Check
        run: terraform fmt -check

      # =====================================================
      # VALIDATE
      # =====================================================

      - name: Terraform Validate
        run: terraform validate

      # =====================================================
      # PLAN
      # =====================================================

      - name: Terraform Plan
        if: inputs.action == 'apply'
        run: |
          terraform plan \
            -var="mtls_mode=${{ inputs.mtls_mode }}" \
            -var="authorization_enabled=${{ inputs.authorization_enabled }}" \
            -var="jwt_enabled=${{ inputs.jwt_enabled }}" \
            -var="jwt_issuer=${{ inputs.jwt_issuer }}" \
            -var="jwt_jwks_uri=${{ inputs.jwt_jwks_uri }}"

      # =====================================================
      # APPLY
      # =====================================================

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply \
            -auto-approve \
            -var="mtls_mode=${{ inputs.mtls_mode }}" \
            -var="authorization_enabled=${{ inputs.authorization_enabled }}" \
            -var="jwt_enabled=${{ inputs.jwt_enabled }}" \
            -var="jwt_issuer=${{ inputs.jwt_issuer }}" \
            -var="jwt_jwks_uri=${{ inputs.jwt_jwks_uri }}"

      # =====================================================
      # DESTROY
      # =====================================================

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      # =====================================================
      # VERIFY SECURITY RESOURCES
      # =====================================================

      - name: Verify Security Resources
        if: inputs.action == 'apply'
        run: |
          echo "========== PeerAuthentication =========="
          kubectl get peerauthentication -A || true

          echo ""
          echo "========== AuthorizationPolicy =========="
          kubectl get authorizationpolicy -A || true

          echo ""
          echo "========== RequestAuthentication =========="
          kubectl get requestauthentication -A || true

      # =====================================================
      # SUMMARY
      # =====================================================

      - name: Security Summary
        run: |
          echo ""
          echo "==============================================="
          echo "      SERVICE MESH SECURITY SUMMARY"
          echo "==============================================="
          echo ""
          echo "Action                 : ${{ inputs.action }}"
          echo "mTLS Mode              : ${{ inputs.mtls_mode }}"
          echo "Authorization Enabled  : ${{ inputs.authorization_enabled }}"
          echo "JWT Enabled            : ${{ inputs.jwt_enabled }}"
          echo "JWT Issuer             : ${{ inputs.jwt_issuer }}"
          echo "JWT JWKS URI           : ${{ inputs.jwt_jwks_uri }}"
          echo ""
          echo "==============================================="