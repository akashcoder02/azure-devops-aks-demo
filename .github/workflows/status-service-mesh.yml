name: Service Mesh Status

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  service-mesh-status:

    name: Check Istio Service Mesh Status

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout Repository
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # Azure Login
      # ==========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ==========================================================
      # Install kubectl
      # ==========================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # ==========================================================
      # Connect to AKS
      # ==========================================================

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group rg-devops-demo \
            --name aks-devops-demo \
            --overwrite-existing

      # ==========================================================
      # Cluster Information
      # ==========================================================

      - name: Cluster Information
        run: |
          echo "=============================="
          echo "Kubernetes Version"
          echo "=============================="
          kubectl version --short

          echo "=============================="
          echo "Cluster Nodes"
          echo "=============================="
          kubectl get nodes -o wide

      # ==========================================================
      # Istio Control Plane
      # ==========================================================

      - name: Istio Control Plane
        run: |
          echo "=============================="
          echo "Istio Namespace"
          echo "=============================="
          kubectl get ns istio-system

          echo "=============================="
          echo "Istio Pods"
          echo "=============================="
          kubectl get pods -n istio-system -o wide

          echo "=============================="
          echo "Istio Services"
          echo "=============================="
          kubectl get svc -n istio-system

      # ==========================================================
      # Traffic Management
      # ==========================================================

      - name: Traffic Management Resources
        run: |
          echo "=============================="
          echo "Gateways"
          echo "=============================="
          kubectl get gateway -A

          echo "=============================="
          echo "Virtual Services"
          echo "=============================="
          kubectl get virtualservice -A

          echo "=============================="
          echo "Destination Rules"
          echo "=============================="
          kubectl get destinationrule -A

      # ==========================================================
      # Security
      # ==========================================================

      - name: Security Configuration
        continue-on-error: true
        run: |
          echo "=============================="
          echo "Peer Authentication"
          echo "=============================="
          kubectl get peerauthentication -A

          echo "=============================="
          echo "Authorization Policies"
          echo "=============================="
          kubectl get authorizationpolicy -A

      # ==========================================================
      # Sidecar Injection
      # ==========================================================

      - name: Sidecar Injection Status
        run: |
          echo "=============================="
          echo "Namespace Labels"
          echo "=============================="
          kubectl get namespaces --show-labels

      # ==========================================================
      # Ingress Gateway
      # ==========================================================

      - name: Ingress Gateway
        continue-on-error: true
        run: |
          echo "=============================="
          echo "Ingress Gateway"
          echo "=============================="
          kubectl get svc istio-ingressgateway -n istio-system

      # ==========================================================
      # Workflow Summary
      # ==========================================================

      - name: Status Summary
        run: |
          echo "======================================"
          echo "Service Mesh Status Check Completed"
          echo "Control Plane : VERIFIED"
          echo "Traffic Management : VERIFIED"
          echo "Security Configuration : VERIFIED"
          echo "Sidecar Injection : VERIFIED"
          echo "Ingress Gateway : VERIFIED"
          echo "======================================"