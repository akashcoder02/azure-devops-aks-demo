name: Release Application

on:
  workflow_dispatch:
    inputs:

      application_name:
        description: "Application"
        required: true
        default: "tic-tac-toe"
        type: choice
        options:
          - tic-tac-toe
          - tetris


      environment:
        description: "Environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

      deployment_strategy:
        description: "Deployment Strategy"
        required: true
        default: "gitops"
        type: choice
        options:
          - traditional
          - gitops

      deployment_type:
        description: "Deployment Type"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - hpa

      enable_devsecops:
        description: "Enable DevSecOps"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:

  ####################################################
  # Build
  ####################################################

  build:

    uses: ./.github/workflows/build.yaml

    secrets: inherit

    with:
      application_name: ${{ github.event.inputs.application_name }}

  ####################################################
  # DevSecOps Security Scan
  ####################################################

  security:

    if: ${{ github.event.inputs.enable_devsecops == 'true' }}

    needs: build

    uses: ./.github/workflows/security-scan.yml

    secrets: inherit

    with:
      scan_type: application
      scanner: all

  ####################################################
  # Release Gate
  ####################################################

  release-gate:

    if: ${{ github.event.inputs.enable_devsecops == 'true' }}

    needs: security

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Evaluate Security Policy
        run: |

          echo "Evaluating DevSecOps Policy..."

          cd app

          python security/policies/policy_engine.py

  ####################################################
  # Traditional Deployment (Without DevSecOps)
  ####################################################

  traditional-deploy:

    if: >
      github.event.inputs.deployment_strategy == 'traditional' &&
      github.event.inputs.enable_devsecops == 'false'

    needs:
      - build

    uses: ./.github/workflows/deploy.yml

    secrets: inherit

    with:

      application_name: ${{ needs.build.outputs.application_name }}

      image_tag: ${{ needs.build.outputs.image_tag }}

      environment: ${{ github.event.inputs.environment }}

      deployment_type: ${{ github.event.inputs.deployment_type }}

  ####################################################
  # Traditional Deployment (With DevSecOps)
  ####################################################

  traditional-deploy-secure:

    if: >
      github.event.inputs.deployment_strategy == 'traditional' &&
      github.event.inputs.enable_devsecops == 'true'

    needs:
      - build
      - release-gate

    uses: ./.github/workflows/deploy.yml

    secrets: inherit

    with:

      application_name: ${{ needs.build.outputs.application_name }}

      image_tag: ${{ needs.build.outputs.image_tag }}

      environment: ${{ github.event.inputs.environment }}

      deployment_type: ${{ github.event.inputs.deployment_type }}

  ####################################################
  # GitOps Deployment (Without DevSecOps)
  ####################################################

  gitops-deploy:

    if: >
      github.event.inputs.deployment_strategy == 'gitops' &&
      github.event.inputs.enable_devsecops == 'false'

    needs:
      - build

    uses: ./.github/workflows/gitops-deploy.yml

    secrets: inherit

    with:

      application_name: ${{ needs.build.outputs.application_name }}

      image_tag: ${{ needs.build.outputs.image_tag }}

      environment: ${{ github.event.inputs.environment }}

      deployment_type: ${{ github.event.inputs.deployment_type }}

  ####################################################
  # GitOps Deployment (With DevSecOps)
  ####################################################

  gitops-deploy-secure:

    if: >
      github.event.inputs.deployment_strategy == 'gitops' &&
      github.event.inputs.enable_devsecops == 'true'

    needs:
      - build
      - release-gate

    uses: ./.github/workflows/gitops-deploy.yml

    secrets: inherit

    with:

      application_name: ${{ needs.build.outputs.application_name }}

      image_tag: ${{ needs.build.outputs.image_tag }}

      environment: ${{ github.event.inputs.environment }}

      deployment_type: ${{ github.event.inputs.deployment_type }}