name: Traffic Shift

# ==========================================================
# MANUAL TRIGGER
# ==========================================================

on:
  workflow_dispatch:

    inputs:

      application:
        description: "Application Name"
        required: true
        type: string

      service_port:
        description: "Application Service Port"
        required: true
        type: string

      primary_version:
        description: "Primary Version"
        required: true
        type: string

      primary_weight:
        description: "Primary Traffic Weight"
        required: true
        type: string

      canary_version:
        description: "Canary Version"
        required: true
        type: string

      canary_weight:
        description: "Canary Traffic Weight"
        required: true
        type: string

      canary_enabled:
        description: "Enable Canary"
        required: true
        type: boolean

# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  id-token: write
  contents: read

# ==========================================================
# TRAFFIC SHIFT
# ==========================================================

jobs:

  traffic-shift:

    name: Shift Istio Traffic

    runs-on: ubuntu-latest


    steps:

    # ======================================================
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # ======================================================
    # Display Workflow Inputs
    # ======================================================

    - name: Display Inputs
      run: |

        echo "========================================"
        echo "Traffic Shift Request"
        echo "========================================"

        echo "Application      : ${{ github.event.inputs.application }}"
        echo "Service Port     : ${{ github.event.inputs.service_port }}"
        echo "Primary Version  : ${{ github.event.inputs.primary_version }}"
        echo "Primary Weight   : ${{ github.event.inputs.primary_weight }}"
        echo "Canary Version   : ${{ github.event.inputs.canary_version }}"
        echo "Canary Weight    : ${{ github.event.inputs.canary_weight }}"
        echo "Canary Enabled   : ${{ github.event.inputs.canary_enabled }}"

        echo "========================================"

    # ======================================================
    # Azure Login
    # ======================================================

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # ======================================================
    # Install Terraform
    # ======================================================

    # ======================================================
    # Install kubectl
    # ======================================================

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    # ======================================================
    # Connect to AKS
    # ======================================================

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group rg-devops-demo \
          --name aks-devops-demo \
          --overwrite-existing

    # ======================================================
    # Validate Cluster
    # ======================================================

    - name: Verify Cluster
      run: |

        kubectl cluster-info

        kubectl get nodes

    # ======================================================
    # Generate VirtualService
    # ======================================================


    # ======================================================
    # Validate Traffic
    # ======================================================

    - name: Validate Traffic

      run: |

        TOTAL=$((${{ github.event.inputs.primary_weight }} + ${{ github.event.inputs.canary_weight }}))

        if [ "$TOTAL" -ne 100 ]; then

          echo "Traffic weights must total 100"

          exit 1

        fi

    # ======================================================
    # Install yq
    # ======================================================

    - name: Install yq

      run: |

        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
          -O /usr/local/bin/yq

        sudo chmod +x /usr/local/bin/yq

        yq --version
    
    - name: Export VirtualService

      run: |

        kubectl get virtualservice \
          ${{ github.event.inputs.application }} \
          -n default \
          -o yaml > virtualservice.yaml

        cat virtualservice.yaml

    - name: Update Traffic Weights

      env:
        PRIMARY_VERSION: "${{ github.event.inputs.primary_version }}"
        CANARY_VERSION: "${{ github.event.inputs.canary_version }}"
        PRIMARY_WEIGHT: "${{ github.event.inputs.primary_weight }}"
        CANARY_WEIGHT: "${{ github.event.inputs.canary_weight }}"

      run: |

        yq e '
          (.spec.http[].route[] | select(.destination.subset == env(PRIMARY_VERSION))).weight = (env(PRIMARY_WEIGHT) | tonumber) |
          (.spec.http[].route[] | select(.destination.subset == env(CANARY_VERSION))).weight = (env(CANARY_WEIGHT) | tonumber)
        ' -i virtualservice.yaml

    - name: Cleanup Metadata

      run: |

        yq e '
          del(
            .metadata.uid,
            .metadata.resourceVersion,
            .metadata.creationTimestamp,
            .metadata.generation,
            .metadata.managedFields,
            .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
          )
        ' -i virtualservice.yaml

    - name: Show Updated VirtualService

      run: |

        echo "========================================"

        cat virtualservice.yaml

    # ======================================================
    # Apply VirtualService
    # ======================================================

    - name: Apply VirtualService

      run: |

        kubectl apply -f virtualservice.yaml




    # ======================================================
    # Current Service Mesh
    # ======================================================

    - name: Current Istio Configuration
      run: |

        echo "Gateways"
        kubectl get gateway -A

        echo ""

        echo "Virtual Services"
        kubectl get virtualservice -A

        echo ""

        echo "Destination Rules"
        kubectl get destinationrule -A



    # ======================================================
    # Verify Virtual Service
    # ======================================================

    - name: Verify Virtual Service

      run: |

        echo "===================================="

        kubectl get virtualservice -A

        echo ""

        kubectl describe virtualservice \
          ${{ github.event.inputs.application }} \
          -n default

        echo ""

        echo "Traffic Routing"

        kubectl get virtualservice \
        ${{ github.event.inputs.application }} \
        -o yaml | grep -A12 "route:"


    # ======================================================
    # Verify Destination Rule
    # ======================================================

    - name: Verify Destination Rule

      run: |

        echo "===================================="

        kubectl get destinationrule -A

        echo ""

        kubectl describe destinationrule \
          ${{ github.event.inputs.application }} \
          -n default

    # ======================================================
    # SUMMARY
    # ======================================================

    - name: Workflow Summary
      run: |

        echo "========================================"

        echo "Traffic Shift Workflow Completed"

        echo ""

        echo "Dashboard           : SUCCESS"

        echo "GitHub Workflow     : SUCCESS"

        echo "Azure Login         : SUCCESS"

        echo "AKS Connection      : SUCCESS"

        echo "VirtualService Generated : SUCCESS"

        echo "VirtualService Applied   : SUCCESS"

        echo ""

        echo "========================================"