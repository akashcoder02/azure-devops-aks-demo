name: Traffic Shift

# ==========================================================
# MANUAL TRIGGER
# ==========================================================

on:
  workflow_dispatch:

    inputs:

      application:
        description: "Application Name"
        required: true
        type: string

      service_port:
        description: "Application Service Port"
        required: true
        type: string

      primary_version:
        description: "Primary Version"
        required: true
        type: string

      primary_weight:
        description: "Primary Traffic Weight"
        required: true
        type: string

      canary_version:
        description: "Canary Version"
        required: true
        type: string

      canary_weight:
        description: "Canary Traffic Weight"
        required: true
        type: string

      canary_enabled:
        description: "Enable Canary"
        required: true
        type: string

# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  id-token: write
  contents: read

# ==========================================================
# TRAFFIC SHIFT
# ==========================================================

jobs:

  traffic-shift:

    name: Shift Istio Traffic

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/addons/service-mesh

    steps:

    # ======================================================
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository
      uses: actions/checkout@v4

    # ======================================================
    # Display Workflow Inputs
    # ======================================================

    - name: Display Inputs
      run: |

        echo "========================================"
        echo "Traffic Shift Request"
        echo "========================================"

        echo "Application      : ${{ github.event.inputs.application }}"
        echo "Service Port     : ${{ github.event.inputs.service_port }}"
        echo "Primary Version  : ${{ github.event.inputs.primary_version }}"
        echo "Primary Weight   : ${{ github.event.inputs.primary_weight }}"
        echo "Canary Version   : ${{ github.event.inputs.canary_version }}"
        echo "Canary Weight    : ${{ github.event.inputs.canary_weight }}"
        echo "Canary Enabled   : ${{ github.event.inputs.canary_enabled }}"

        echo "========================================"

    # ======================================================
    # Azure Login
    # ======================================================

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # ======================================================
    # Install Terraform
    # ======================================================

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ======================================================
    # Install kubectl
    # ======================================================

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    # ======================================================
    # Connect to AKS
    # ======================================================

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group rg-devops-demo \
          --name aks-devops-demo \
          --overwrite-existing

    # ======================================================
    # Validate Cluster
    # ======================================================

    - name: Verify Cluster
      run: |

        kubectl cluster-info

        kubectl get nodes

    # ======================================================
    # Terraform Init
    # ======================================================

    - name: Terraform Init
      run: terraform init

    # ======================================================
    # Terraform Validate
    # ======================================================

    - name: Terraform Validate
      run: terraform validate

    # ======================================================
    # Current Service Mesh
    # ======================================================

    - name: Current Istio Configuration
      run: |

        echo "Gateways"
        kubectl get gateway -A

        echo ""

        echo "Virtual Services"
        kubectl get virtualservice -A

        echo ""

        echo "Destination Rules"
        kubectl get destinationrule -A

    # ======================================================
    # Terraform Plan
    # ======================================================

    - name: Terraform Plan

      run: |

        terraform plan \
          -out=tfplan \
          -var="traffic_application=${{ github.event.inputs.application }}" \
          -var="primary_weight_override=${{ github.event.inputs.primary_weight }}" \
          -var="canary_weight_override=${{ github.event.inputs.canary_weight }}" \
          -var="canary_enabled_override=${{ github.event.inputs.canary_enabled }}"


    # ======================================================
    # Terraform Apply
    # ======================================================

    - name: Terraform Apply

      run: |

        terraform apply -auto-approve tfplan


    # ======================================================
    # Verify Virtual Service
    # ======================================================

    - name: Verify Virtual Service

      run: |

        echo "===================================="

        kubectl get virtualservice -A

        echo ""

        kubectl describe virtualservice \
          ${{ github.event.inputs.application }} \
          -n default


    # ======================================================
    # Verify Destination Rule
    # ======================================================

    - name: Verify Destination Rule

      run: |

        echo "===================================="

        kubectl get destinationrule -A

        echo ""

        kubectl describe destinationrule \
          ${{ github.event.inputs.application }} \
          -n default

    # ======================================================
    # SUMMARY
    # ======================================================

    - name: Workflow Summary
      run: |

        echo "========================================"

        echo "Traffic Shift Workflow Completed"

        echo ""

        echo "Dashboard           : SUCCESS"

        echo "GitHub Workflow     : SUCCESS"

        echo "Azure Login         : SUCCESS"

        echo "AKS Connection      : SUCCESS"

        echo "Terraform Init      : SUCCESS"

        echo "Terraform Apply     : PENDING"

        echo ""

        echo "========================================"