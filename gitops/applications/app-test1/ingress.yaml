apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-test1-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/x-forwarded-prefix: "/app-test1"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /app-test1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-test1
                port:
                  number: 80
