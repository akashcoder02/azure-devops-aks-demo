apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ values.appName }}-mysql-secrets
spec:
  provider: azure
  secretObjects:
    - secretName: {{ values.appName }}-db-secret
      type: Opaque
      data:
        - objectName: {{ values.appName }}-mysql-root-password
          key: MYSQL_ROOT_PASSWORD
        - objectName: {{ values.appName }}-mysql-password
          key: MYSQL_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: IDENTITY_PLACEHOLDER
    keyvaultName: agdevopskv2026
    tenantId: "494d8408-c1d7-4771-8716-be4275838741"
    objects: |
      array:
        - |
          objectName: {{ values.appName }}-mysql-root-password
          objectType: secret
        - |
          objectName: {{ values.appName }}-mysql-password
          objectType: secret
