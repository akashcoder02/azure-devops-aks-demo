apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-test1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akashcoder02/azure-devops-aks-demo.git
    targetRevision: main
    path: gitops/applications/app-test1
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
